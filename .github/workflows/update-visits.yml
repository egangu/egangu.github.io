name: Update visits snapshot

on:
  schedule:
    # 06:17 Asia/Shanghai; avoid the busiest minute of the hour.
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      through:
        description: 'Optional report end date (YYYY-MM-DD); defaults to yesterday'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: visits-snapshot-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test snapshot exporter
        run: python -m unittest discover -s scripts/tests -v

      - name: Read Google Analytics and save snapshot
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_START_DATE: ${{ vars.GA4_START_DATE }}
          GA4_HOSTNAME: ${{ vars.GA4_HOSTNAME }}
          REPORT_THROUGH: ${{ inputs.through }}
        run: |
          args=()
          if [[ -n "$REPORT_THROUGH" ]]; then
            args+=(--through "$REPORT_THROUGH")
          fi
          python scripts/update_visits.py "${args[@]}"

      - name: Commit snapshot
        run: |
          git add _data/visits.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Analytics visits snapshot"
          git push origin HEAD:main
