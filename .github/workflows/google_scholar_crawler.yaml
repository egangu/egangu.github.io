name: Get Citation Data

on:
  # Google Scholar routinely blocks requests from shared GitHub-hosted runners.
  # Keep this workflow manual so a transient scraper failure cannot mark the
  # repository unhealthy when the site does not currently display citation data.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Update citation data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [[ -z "$GOOGLE_SCHOLAR_ID" ]]; then
            echo "::error::Repository secret GOOGLE_SCHOLAR_ID is not configured"
            exit 1
          fi

          cd google_scholar_crawler
          python -m pip install -r requirements.txt

          for attempt in 1 2 3; do
            if timeout 120 python main.py; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Google Scholar did not respond after 3 attempts"
              exit 1
            fi
            echo "::warning::Google Scholar attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done

          cd results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add ./*.json
          git commit -m "Updated Citation Data"
          git push "$remote_repo" HEAD:google-scholar-stats --force
