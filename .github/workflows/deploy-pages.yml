name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with GITHUB_TOKEN does not trigger another push workflow.
  workflow_run:
    workflows: [Update visits snapshot]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install CV fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-linuxlibertine fonts-noto-cjk

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Compile CV
        run: |
          typst compile cv/main.typ files/cv.pdf
          typst compile cv/main-zh.typ files/cv-zh.pdf

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
