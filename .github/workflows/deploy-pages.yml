name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with GITHUB_TOKEN does not trigger another push workflow.
  workflow_run:
    workflows: [Update visits snapshot]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install CV fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-linuxlibertine fonts-noto-cjk

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Compile CV
        run: |
          typst compile cv/main.typ files/cv.pdf
          typst compile cv/main-zh.typ files/cv-zh.pdf

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Build Seoul site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.seoul.yml --destination _site-seoul

      - name: Upload Seoul artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-seoul
          path: _site-seoul
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-seoul:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Seoul artifact
        uses: actions/download-artifact@v4
        with:
          name: homepage-seoul
          path: _site-seoul

      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.SEOUL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.SEOUL_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/seoul_homepage
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish to Seoul
        env:
          DEPLOY_HOST: ${{ vars.SEOUL_DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          rsync -rlptz --delete-delay --delay-updates \
            -e 'ssh -i ~/.ssh/seoul_homepage -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15' \
            _site-seoul/ "homepage-deploy@${DEPLOY_HOST}:/"

      - name: Verify public homepage
        run: |
          curl --fail --silent --show-error --max-time 30 https://yggu.site/ -o /tmp/homepage.html
          grep -Fq '<link rel="canonical" href="https://yggu.site/">' /tmp/homepage.html
          curl --fail --silent --show-error --max-time 30 https://yggu.site/files/cv.pdf -o /tmp/cv.pdf
          test "$(head -c 5 /tmp/cv.pdf)" = '%PDF-'

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/seoul_homepage
